name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_SYSTEM_IMAGE: system-images;android-36.1;google_apis_playstore;x86_64

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - run: ./gradlew detekt lint
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: "**/build/reports/"

  jvm-tests:
    name: JVM and Android host tests, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - run: ./gradlew jvmTest testAndroidHostTest :desktopApp:test koverVerify koverHtmlReport
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/html/
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/"

  ios-tests:
    name: iOS tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-konan
      - run: ./gradlew iosSimulatorArm64Test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: "**/build/reports/tests/"

  desktop-e2e:
    name: Desktop e2e tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-allure
      - run: xvfb-run -a ./scripts/desktop-e2e.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-report
          path: .allure/desktop/reports/

  android-e2e:
    name: Android e2e tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-allure
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: sdk
        run: echo "dir=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.sdk.outputs.dir }}/system-images
          key: android-system-image-${{ env.ANDROID_SYSTEM_IMAGE }}
      - name: Install the emulator and the system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install emulator platform-tools "$ANDROID_SYSTEM_IMAGE" > /dev/null
      - run: ./scripts/android-e2e-test.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-report
          path: .allure/android/reports/
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-logs
          path: |
            .git/e2e-avd/emulator.log
            **/build/reports/androidTests/

  ios-e2e:
    name: iOS e2e tests
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-konan
      - uses: ./.github/actions/setup-allure
      - name: Select the simulator
        run: |
          runtimes="$(xcrun simctl list runtimes available -j)"
          identifier="$(jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier' <<< "$runtimes")"
          os_version="$(jq -r --arg id "$identifier" '.runtimes[] | select(.identifier == $id) | .name | sub("^iOS "; "")' <<< "$runtimes")"
          device="$(xcrun simctl list devices available -j | jq -r --arg id "$identifier" '[.devices[$id][] | .name | select(startswith("iPhone"))] | if index("iPhone 17 Pro") then "iPhone 17 Pro" else first end // empty')"
          if [[ -z "$device" ]]; then
            echo "No iPhone simulator on $identifier" >&2
            exit 1
          fi
          echo "Using $device on iOS $os_version"
          echo "OS_VERSION=$os_version" >> "$GITHUB_ENV"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - run: ./scripts/ios-e2e.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-report
          path: .allure/ios/reports/
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-results
          path: .allure/ios/results/

  scripts:
    name: Script and hook tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 -m unittest discover -s core/ui-test/camera/scripts/tests

  ci-passed:
    name: CI passed
    if: always()
    needs: [static-analysis, jvm-tests, ios-tests, desktop-e2e, android-e2e, ios-e2e, scripts]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
